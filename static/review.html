<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review matches</title>
<link rel="icon" type="image/svg+xml" href="https://bix.computer/favicon.svg">
<style>
  :root { --bg:#fbfaf8; --fg:#1a1a1a; --dim:#6b6b6b; --line:#e4e1dc; --card:#fff; --accent:#8a3324; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --fg:#e8e6e3; --dim:#97948f; --line:#2b2a28; --card:#1c1b1a; --accent:#d97757; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); padding:0 16px 48px;
         font:15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 28px 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 20px; }
  .card { border:1px solid var(--line); background:var(--card); border-radius:10px;
          padding:18px; }
  .names { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
  .lbl { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  .val { font-size:17px; font-weight:600; margin-top:2px; word-break:break-word; }
  .meta { font-size:13px; color:var(--dim); border-top:1px solid var(--line);
          padding-top:12px; }
  .meta a { color: var(--accent); }
  .btns { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  button { flex:1; min-width:96px; padding:10px; border-radius:8px; cursor:pointer;
           border:1px solid var(--line); background:var(--card); color:var(--fg);
           font-size:14px; }
  button.yes { border-color:var(--accent); color:var(--accent); }
  .keys { color:var(--dim); font-size:12px; margin-top:14px; text-align:center; }
  .done { text-align:center; padding:40px 0; color:var(--dim); }
</style>
</head>
<body><div class="wrap">
  <h1>Review matches</h1>
  <div class="sub" id="count"></div>
  <div id="card"></div>
  <div class="keys">y confirm · n reject · i ignore this artist · s skip</div>
  <p><a href="/" style="color:var(--dim);font-size:13px">&larr; back to shows</a></p>
</div>
<script>
let queue = [], i = 0;

async function load() {
  const r = await fetch('/api/pending');
  queue = (await r.json()).pending;
  i = 0;
  draw();
}

function draw() {
  const el = document.getElementById('card');
  const c = document.getElementById('count');
  if (i >= queue.length) {
    c.textContent = '';
    el.innerHTML = '<div class="done">Nothing left to review.</div>';
    return;
  }
  const p = queue[i];
  c.textContent = `${i + 1} of ${queue.length}`;
  const pg = JSON.parse(p.plex_genres || '[]').join(', ') || '—';
  const jg = JSON.parse(p.jb_genres || '[]').join(', ') || '—';
  el.innerHTML = `
    <div class="card">
      <div class="names">
        <div><div class="lbl">In your library</div><div class="val">${esc(p.plex_name)}</div>
             <div class="lbl" style="margin-top:6px">${esc(pg)}</div></div>
        <div><div class="lbl">On JamBase</div><div class="val">${esc(p.jb_name)}</div>
             <div class="lbl" style="margin-top:6px">${esc(jg)}</div></div>
      </div>
      <div class="meta">
        ${p.event_count} upcoming show${p.event_count === 1 ? '' : 's'} ·
        ${esc(p.next_event || '')}
        ${p.event_url ? ` · <a href="${esc(p.event_url)}" target="_blank" rel="noopener">JamBase</a>` : ''}
      </div>
      <div class="btns">
        <button class="yes" onclick="decide('confirm')">Same artist</button>
        <button onclick="decide('reject')">Different</button>
        <button onclick="decide('ignore')">Never match</button>
        <button onclick="skip()">Skip</button>
      </div>
    </div>`;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function decide(action) {
  const p = queue[i];
  await fetch('/api/decide', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({jambase_id: p.jambase_id, action,
                          plex_rating_key: p.plex_rating_key})
  });
  i++; draw();
}
function skip() { i++; draw(); }

addEventListener('keydown', e => {
  if (i >= queue.length) return;
  if (e.key === 'y') decide('confirm');
  else if (e.key === 'n') decide('reject');
  else if (e.key === 'i') decide('ignore');
  else if (e.key === 's') skip();
});

load();
</script>
</body></html>
